site_name: Tell A Bot API Reference
site_description: API documentation for Tell A Bot — receive SMS online with temporary US phone numbers for SMS verification and OTP codes.
site_url: https://tellabot.netlify.app
repo_url: https://github.com/getsms-online/tellabot-api-command-reference

docs_dir: mkdocs_docs
site_dir: site

theme:
  name: material
  palette:
    primary: green
  features:
    - content.code.copy
    - navigation.top

nav:
  - API Reference: index.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: .
